<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>MUSA | Checkout</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

<header>
    <h1>MUSA</h1>

    <nav>
        <a href="index.html">Home</a>
        <a href="index.html#collections">Shop</a>
        <a href="cart.html">Cart</a>
    </nav>
</header>


<section class="checkout-page">

    <h2>Checkout</h2>

    <form class="checkout-box" id="checkout-form">

        <h3>Delivery Information</h3>

        <label for="full-name">Full Name</label>
<input id="full-name" type="text" placeholder="Enter your full name">

<label for="phone">Phone Number</label>
<input id="phone" type="tel" placeholder="Enter your phone number">

<label for="address">Address</label>
<input id="address" type="text" placeholder="Enter your delivery address">

<label for="city">City</label>
<input id="city" type="text" placeholder="Enter your city">

<label for="pin">PIN Code</label>
<input id="pin" type="text" placeholder="Enter your PIN code">

<button type="submit">Place Order</button>

</form>
    </form>

</section>


<footer>

    <h3>MUSA</h3>

    <p>Wear Confidence. Define Your Style.</p>

    <p>© 2026 MUSA. All Rights Reserved.</p>

</footer>
<script>
const checkoutForm = document.getElementById("checkout-form");
checkoutForm.addEventListener("submit", function(event) {
    event.preventDefault();
    alert("Thank you for shopping with MUSA! Your order has been placed.");
    localStorage.removeItem("cart");
    window.location.href = "index.html";
});
</script>
</body>

</html>
