<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>MUSA | Checkout</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

<header>
    <h1>MUSA</h1>

    <nav>
        <a href="index.html">Home</a>
        <a href="index.html#collections">Shop</a>
        <a href="cart.html">Cart</a>
    </nav>
</header>

<section class="checkout-page">

    <h2>Checkout</h2>

    <form class="checkout-box" id="checkout-form">

        <h3>Delivery Information</h3>

        <label for="full-name">Full Name</label>
        <input
            id="full-name"
            type="text"
            placeholder="Enter your full name"
        >

        <label for="phone">Phone Number</label>
        <input
            id="phone"
            type="tel"
            placeholder="Enter your phone number"
        >

        <label for="address">Address</label>
        <input
            id="address"
            type="text"
            placeholder="Enter your delivery address"
        >

        <label for="city">City</label>
        <input
            id="city"
            type="text"
            placeholder="Enter your city"
        >

        <label for="pin">PIN Code</label>
        <input
            id="pin"
            type="text"
            placeholder="Enter your PIN code"
        >

        <button type="submit">Place Order</button>

    </form>

</section>

<footer>

    <h3>MUSA</h3>

    <p>Wear Confidence. Define Your Style.</p>

    <p>© 2026 MUSA. All Rights Reserved.</p>

</footer>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>

const SUPABASE_URL =
    "https://gepjikjasfcwvrvdpzka.supabase.co";

const SUPABASE_KEY =
    "sb_publishable_qFY5eWE9M-g32a8uzKUNmA_Ea7R3Mxa";

const supabaseClient =
    supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
    );

const checkoutForm =
    document.getElementById("checkout-form");

checkoutForm.addEventListener(
    "submit",
    async function(event) {

        event.preventDefault();

        const {
            data: { session }
        } = await supabaseClient.auth.getSession();

        if (!session) {
            alert("Please log in before placing your order.");
            window.location.href = "login.html";
            return;
        }

        const cart =
            JSON.parse(localStorage.getItem("cart")) || [];

        if (cart.length === 0) {
            alert("Your cart is empty.");
            window.location.href = "cart.html";
            return;
        }

        const fullName =
            document
                .getElementById("full-name")
                .value
                .trim();

        const phone =
            document
                .getElementById("phone")
                .value
                .trim();

        const address =
            document
                .getElementById("address")
                .value
                .trim();

        const city =
            document
                .getElementById("city")
                .value
                .trim();

        const pin =
            document
                .getElementById("pin")
                .value
                .trim();

        if (
            !fullName ||
            !phone ||
            !address ||
            !city ||
            !pin
        ) {
            alert(
                "Please fill in all delivery information."
            );
            return;
        }

        const totalAmount =
            cart.reduce(
                (total, item) =>
                    total +
                    Number(item.price) *
                    (item.quantity || 1),
                0
            );

        const {
            data: order,
            error: orderError
        } = await supabaseClient
            .from("orders")
            .insert({
                user_id: session.user.id,
                total_amount: totalAmount,
                status: "pending",
                full_name: fullName,
                phone: phone,
                address: address,
                city: city,
                pin: pin
            })
            .select()
            .single();

        if (orderError) {

            console.error(
                "ORDER ERROR:",
                orderError
            );

            alert(
                "Could not create your order.\n\n" +
                orderError.message
            );

            return;
        }

        const orderItems =
            cart.map(item => ({
                order_id: order.id,
                product_name: item.name,
                quantity: item.quantity || 1,
                price: Number(item.price)
            }));

        const {
            error: itemsError
        } = await supabaseClient
            .from("order_items")
            .insert(orderItems);

        if (itemsError) {

            console.error(
                "ORDER ITEMS ERROR:",
                itemsError
            );

            alert(
                "Order items error:\n\n" +
                itemsError.message +
                "\n\nDetails:\n" +
                (itemsError.details || "None") +
                "\n\nHint:\n" +
                (itemsError.hint || "None")
            );

            return;
        }

        localStorage.removeItem("cart");

        alert(
            "Thank you for shopping with MUSA! " +
            "Your order has been created."
        );

        window.location.href =
            "index.html";

    }
);

</script>

</body>
</html>
