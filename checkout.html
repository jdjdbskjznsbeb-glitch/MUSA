<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>MUSA | Checkout</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

<header>
    <h1>MUSA</h1>

    <nav>
        <a href="index.html">Home</a>
        <a href="index.html#collections">Shop</a>
        <a href="cart.html">Cart</a>
    </nav>
</header>


<section class="checkout-page">

    <h2>Checkout</h2>

    <form class="checkout-box" id"checkout-form">

        <h3>Delivery Information</h3>

        <input type="text" placeholder="Full Name">

        <input type="tel" placeholder="Phone Number">

        <input type="text" placeholder="Address">

        <input type="text" placeholder="City">

        <input type="text" placeholder="PIN Code">

        <button type="submit">Place Order</button>

    </form>

</section>


<footer>

    <h3>MUSA</h3>

    <p>Wear Confidence. Define Your Style.</p>

    <p>© 2026 MUSA. All Rights Reserved.</p>

</footer>
<script>
const checkoutForm = document.getElementById("checkout-form");
checkoutForm.addEventListener("submit", function(event) {
    event.preventDefault();
    alert("Thank you for shopping with MUSA! Your order has been placed.");
    localStorage.removeItem("cart");
    window.location.href = "index.html";
});
</script>
</body>

</html>
